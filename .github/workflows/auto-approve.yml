name: PR Auto-Approve (Copilot)

# Dogfooding: this repo runs its own published action against itself.
#
# Pinned to @v1 (the released tag) rather than ./ on purpose — the gate is the
# previously-released, reviewed logic, so a PR that breaks decide.js cannot use
# its own broken code to approve itself.

on:
  pull_request:
    branches: [develop]
    types: [opened, ready_for_review, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]

jobs:
  # The check-run name is load-bearing. It comes from `name:` below (GitHub
  # falls back to the job key only when `name:` is omitted), and the check_run
  # branch of the if: excludes it by that exact string to break the feedback
  # loop — this job completing would otherwise re-trigger the workflow.
  # Changing `name:` without updating that string re-arms the loop; the job key
  # is kept identical purely so the two can't drift unnoticed.
  auto-approve:
    name: auto-approve
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: read
    concurrency:
      group: >-
        pr-auto-approve-${{ github.repository }}-${{
          github.event.pull_request.number ||
          github.event.check_run.pull_requests[0].number ||
          github.run_id
        }}
      cancel-in-progress: true
    # BASE-BRANCH SYNC — 3 points must agree: on.pull_request.branches above,
    # the base.ref check here, and the base-branch input below. All three say
    # 'develop' because the pr-copilot ruleset targets the default branch only,
    # so PRs to main never receive a Copilot review and could never be approved.
    #
    # Note the base.ref / draft / fork conditions below apply ONLY to the
    # pull_request and pull_request_review branch of this expression. A
    # check_run event carries no pull_request payload, so for that branch the
    # same three gates are re-applied inside the action instead, after it
    # resolves the associated PR — they are not skipped, just enforced later.
    #
    # 'cnslr-bt' is hard-coded rather than read from a repo variable: an unset
    # variable makes this comparison `github.actor != ''`, which is always true
    # and would silently disable the loop guard. A literal cannot fail open.
    # It MUST stay identical to the bot-login input below.
    if: >-
      (
        (
          github.event_name == 'pull_request' ||
          (
            github.event_name == 'pull_request_review' &&
            github.actor != 'cnslr-bt'
          )
        ) &&
        github.event.pull_request.base.ref == 'develop' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'check_run' &&
        github.event.check_run.name != 'auto-approve' &&
        github.event.check_run.pull_requests[0] != null
      )
    steps:
      # Deliberately omitted, because the defaults are correct here:
      #   rounds-threshold      (3 — see the README note on why 1 is unsafe)
      #   allow-no-checks       (false — test-pr-auto-approve.yml now runs on
      #                          every PR, so a real check always exists)
      #   slack-bot-token       (no such secret in this org)
      #   sandbox-repos /
      #   test-copilot-logins   (production repo — setting these would weaken
      #                          the Copilot gate)
      - uses: SteerSpec/strspc-pr-review@v1
        with:
          bot-login: cnslr-bt
          bot-github-token: ${{ secrets.BOT_TOKEN }}
          base-branch: develop
