name: E2E

# Runs the synthetic suite in e2e/pr-auto-approve against the sandbox in
# testbed-multi-org, with the action pinned to the commit under test. Nothing else
# runs action.yml from source: auto-approve.yml pins @v1 so that a PR cannot use
# its own logic to approve itself.
#
# Only on PRs into main and on demand: the suite takes too long for PRs into
# develop. On main it is the gate on a release. To check a branch before that,
# dispatch this workflow on it, with scenarios to run only some.
#
# One job per group in scenarios.json, one after another, so "Re-run failed jobs"
# repeats only the groups that failed. The e2e job then reports them as one check,
# which is the one the e2e-main ruleset requires.
#
# pull_request, not pull_request_target: this has to run the PR's own harness and
# action. So a same-repo PR can read the two secrets by editing this file, and its
# action code runs in the sandbox with the sandbox's approval token. That is why
# all three tokens reach only the sandbox and none is the production BOT_TOKEN.
# Fork PRs get no secrets, so the jobs' if: skips them.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario names, separated by spaces. Blank runs them all.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Picks the groups to run: all of them, or those holding a named scenario.
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      partial: ${{ steps.groups.outputs.partial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - id: groups
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          groups=$(jq -c --arg s "$SCENARIOS" '
            ($s | split(" ") | map(select(. != ""))) as $named
            | ($named - [.scenarios[].name]) as $unknown
            | if ($unknown | length) > 0 then error("unknown scenario: \($unknown | join(" "))")
              elif ($named | length) == 0 then .groups
              else . as $m | [.groups[] | select(. as $g | any($m.scenarios[];
                .group == $g and (.name as $n | $named | index($n))))]
              end' e2e/pr-auto-approve/scenarios.json)
          # Partial only if a name was given: input of nothing but spaces runs them all.
          partial=false
          [ -n "${SCENARIOS// /}" ] && partial=true
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "partial=$partial" >> "$GITHUB_OUTPUT"
          echo "groups: $groups, partial: $partial"

  suite:
    name: group ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One sandbox, so one group at a time. A failed group doesn't stop the rest.
      max-parallel: 1
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    # Longer than the steps' own timeouts added up, on purpose. A step timeout fails
    # the check. A job timeout cancels it, and decide.js counts cancelled as passed.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read
    env:
      # E2E_ADMIN_TOKEN belongs to the enterprise owner, which sandbox.sh needs for
      # its commits to main. It is also the reviewer identity.
      GH_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
      E2E_BOT_TOKEN: ${{ secrets.BOT_TOKEN_SANDBOX }}
      E2E_REPO: testbed-multi-org/strspc-pr-review-sandbox
      E2E_REVIEWER_LOGIN: pleberre
      E2E_APPROVER_LOGIN: cnslr-bt
      # A sandbox run can sit queued for minutes, and the default 180s isn't enough.
      E2E_TIMEOUT: 420
    steps:
      # One sandbox serves every run, so runs take turns in the order they started.
      # Not a concurrency: group, which cancels a displaced run: decide.js counts a
      # cancelled check as passed. Ordered by run_started_at, not run id, because a
      # re-run keeps its id but starts again: by id, it would overlap a newer run.
      # Every group waits, because a re-run group may follow another run's groups.
      - name: Wait for runs that started earlier
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The default shell has no pipefail, so a failed lookup would count as no runs.
          set -o pipefail
          me=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          # Every page of every status short of completed, so no run is missed
          # however old it is.
          ahead() {
            local s
            for s in requested waiting pending queued in_progress; do
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?status=$s&per_page=100" \
                --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID
                  and (.run_started_at < \"$me\" or (.run_started_at == \"$me\" and .id < $GITHUB_RUN_ID)))
                  | .id" || return 1
            done
          }
          while true; do
            earlier=$(ahead | wc -l) || earlier=unknown
            [ "$earlier" -eq 0 ] 2>/dev/null && break
            sleep 60
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      # Each group puts its own commit under test, since another run may have
      # used the sandbox since the group before it.
      - name: Put this commit under test
        timeout-minutes: 5
        run: e2e/pr-auto-approve/sandbox.sh sync "$SHA"
      - name: Run the group
        timeout-minutes: 60
        # run.sh rejects any name that isn't a scenario.
        run: |
          read -r -a selected <<<"$SCENARIOS"
          e2e/pr-auto-approve/run.sh --group "$GROUP" "${selected[@]}"
        env:
          E2E_EXPECT_SHA: ${{ env.SHA }}
          GROUP: ${{ matrix.group }}
          SCENARIOS: ${{ inputs.scenarios }}

  # The check the e2e-main ruleset requires. It fails on a cancelled or skipped
  # group too, so it can't pass on anything less than every group passing.
  # A partial run reports under its own name, so it can't stand in for the full
  # suite: as `e2e` on the same commit, it would replace a failed check. If plan
  # fails, the name falls back to e2e, which fails too: a failure can't pass a gate.
  e2e:
    name: ${{ needs.plan.outputs.partial == 'true' && 'e2e-partial' || 'e2e' }}
    needs: [plan, suite]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SUITE: ${{ needs.suite.result }}
        run: |
          echo "plan: $PLAN, groups: $SUITE"
          [ "$PLAN" = success ] && [ "$SUITE" = success ]
