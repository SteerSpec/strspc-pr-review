name: Sync marketplace pin

# The skills in this repo reach users through SteerSpec/.claude, whose
# marketplace entry pins this repo at a tag:
#
#   {"source": "git-subdir", "url": "…/strspc-pr-review.git",
#    "path": "skills", "ref": "v1.4.0", "sha": "…", "version": "1.4.0"}
#
# Releasing here changes nothing for them until that pin moves. Nothing else
# moves it: .claude's bump workflow deliberately selects `source == "./"` so it
# can never bump a cross-linked entry out of step with its pin. So this runs
# after a release and opens the PR that does it — see the `on:` block for why
# "after a release" is not spelled `release: [published]`.
#
# It authenticates with BOT_TOKEN rather than GITHUB_TOKEN for two reasons: the
# default token has no access to another repository at all, and a
# GITHUB_TOKEN-authored commit would leave the resulting PR's head SHA with no
# checks, which .claude's own auto-approve refuses to approve.
#
# CONSEQUENCE, and it is not a bug to be fixed: the PR arrives authored by the
# bot, so .claude's auto-approve skips it with "PR author is the bot itself".
# GitHub blocks self-approval, and there is no second bot identity to open it
# as. Every pin PR therefore needs one human approval. That is fine — the
# automation's value is in never forgetting the edit and never getting the sha
# wrong, not in saving a click.

on:
  # NOT `release: [published]`, which cannot work here and shipped broken in
  # v1.5.0 before this fix. release-please publishes the release with
  # secrets.GITHUB_TOKEN, and events generated by GITHUB_TOKEN never start a
  # workflow run — GitHub's recursion guard. The release appears, no run
  # follows, and nothing says why. This repo's own action exists partly to work
  # around that same guard; it caught us anyway.
  #
  # workflow_run is the re-entry that works, because it keys on the triggering
  # run COMPLETING rather than on a token-generated event. It fires on every
  # Release Please run, most of which only touch the release PR — those resolve
  # to the current tag and exit at the already-pinned guard, so the no-op is
  # free.
  workflow_run:
    workflows: ['Release Please']
    types: [completed]
  # For re-running against a tag whose release already published — the guards
  # below make that a no-op when the pin is already correct.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (e.g. v1.5.0)
        required: true

permissions:
  contents: read

concurrency:
  # Serialize, so two releases in quick succession can't race on .claude's head.
  group: sync-marketplace-pin
  cancel-in-progress: false

jobs:
  sync:
    # A failed Release Please run has published nothing to pin to.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Open the pin-update PR in the marketplace repo
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: SteerSpec/.claude
          TARGET_FILE: .claude-plugin/marketplace.json
          # github.event.inputs, not the inputs context: this workflow has two
          # triggers, and only one of them is workflow_dispatch. Dereferencing a
          # property that doesn't exist on the event payload is documented to
          # give an empty string, which is exactly the behaviour wanted on a
          # workflow_run trigger.
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          # workflow_run carries no release payload — it only says "Release
          # Please finished". Ask what the latest release is: if that run cut
          # one, this is it; if it only touched the release PR, this is the
          # previous tag and the already-pinned guard below exits cleanly.
          #
          # Deliberately NOT `|| true`: after a successful Release Please run,
          # being unable to read the latest release means something is wrong
          # (auth, rate limit, a repo that has never released), and swallowing
          # that turns a real failure into a green run that quietly pinned
          # nothing. Silent no-ops are the exact failure class this workflow has
          # already shipped twice.
          TAG="${TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$SOURCE_REPO" --json tagName --jq '.tagName')"
          fi
          # Belt and braces: gh failing is now fatal under set -e, but an empty
          # tagName would slip past that and read as "sync everything to ''".
          if [ -z "$TAG" ]; then
            echo "Could not determine a release tag for $SOURCE_REPO." >&2
            exit 1
          fi

          version="${TAG#v}"
          # Anchored and exact, deliberately. Two reasons: .claude's validate.yml
          # rejects a non-semver version, and it would do so only AFTER this PR
          # exists; and TAG comes from workflow_dispatch input, so it reaches gh
          # as an argument. Everything below quotes it, but a tag that is not
          # plainly MAJOR.MINOR.PATCH has no business getting that far.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH; refusing to sync." >&2
            exit 1
          fi

          sha="$(gh api "repos/$SOURCE_REPO/commits/$TAG" --jq '.sha')"
          url="https://github.com/$SOURCE_REPO.git"

          gh api "repos/$TARGET_REPO/contents/$TARGET_FILE?ref=main" --jq '.content' \
            | base64 -d > marketplace.json

          # Select by source.url throughout — read, compare and update — so a
          # rename or a reordering cannot silently retarget this at someone
          # else's entry. Resolving to a name and then keying on THAT would
          # quietly depend on .claude's duplicate-name check to stay correct,
          # which is an invariant enforced in a different repo.
          matches="$(jq --arg u "$url" \
            '[.plugins[] | select(.source.url? == $u)] | length' marketplace.json)"
          if [ "$matches" -eq 0 ]; then
            echo "No entry in $TARGET_REPO points at $url; nothing to sync." && exit 0
          fi
          if [ "$matches" -gt 1 ]; then
            # Legitimate one day (this repo cross-linked twice at different
            # paths), but then each entry needs its own skills list — so stop
            # rather than write the same one over both.
            echo "$matches entries point at $url; refusing to guess which to pin." >&2
            exit 1
          fi
          # Only for log lines and the PR body from here on.
          name="$(jq -r --arg u "$url" \
            'first(.plugins[] | select(.source.url? == $u) | .name)' marketplace.json)"

          current_ref="$(jq -r --arg u "$url" \
            'first(.plugins[] | select(.source.url? == $u) | .source.ref) // ""' marketplace.json)"
          if [ "$current_ref" = "$TAG" ]; then
            echo "$name already pinned at $TAG; nothing to do." && exit 0
          fi

          # Rebuild the skills list from the tag rather than carrying the old one
          # forward. A release that ADDS a skill would otherwise move the pin
          # without exposing the skill — the entry declares strict:false, so this
          # array is the complete set, not a filter over a directory scan.
          skills="$(gh api "repos/$SOURCE_REPO/contents/skills?ref=$TAG" \
            --jq '[.[] | select(.type == "dir") | "./" + .name] | sort')"
          if [ "$(jq 'length' <<<"$skills")" -eq 0 ]; then
            echo "No skills/ directories at $TAG; refusing to publish an empty set." >&2
            exit 1
          fi

          jq --arg u "$url" --arg ref "$TAG" --arg sha "$sha" --arg v "$version" \
             --argjson skills "$skills" '
            (.plugins[] | select(.source.url? == $u)) |= (
              .source.ref = $ref | .source.sha = $sha | .version = $v | .skills = $skills
            )' marketplace.json > updated.json
          mv -f updated.json marketplace.json

          echo "$name -> ref=$TAG sha=${sha:0:7} version=$version"
          jq -r --arg u "$url" '.plugins[] | select(.source.url? == $u)' marketplace.json

          branch="chore/sync-skills-pin-$TAG"
          base="$(gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq '.object.sha')"
          # Reuse the branch if a previous attempt already created it, committing
          # against ITS head rather than main's — otherwise expectedHeadOid below
          # is stale and the mutation fails.
          if head="$(gh api "repos/$TARGET_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)"; then
            echo "Reusing existing branch $branch"
          else
            gh api "repos/$TARGET_REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base" >/dev/null
            head="$base"
          fi

          # createCommitOnBranch, not the REST Contents API: .claude's main
          # enforces required_signatures and GitHub signs commits made through
          # this mutation automatically. expectedHeadOid makes it a
          # compare-and-swap so a concurrent write can't be clobbered.
          jq -n \
            --arg repo "$TARGET_REPO" \
            --arg branch "$branch" \
            --arg oid "$head" \
            --arg path "$TARGET_FILE" \
            --arg headline "chore: pin strspc-pr-review skills to $TAG" \
            --arg contents "$(base64 -w0 marketplace.json 2>/dev/null || base64 marketplace.json | tr -d '\n')" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $oid,
                fileChanges: {additions: [{path: $path, contents: $contents}]}
              }}}' > payload.json
          gh api graphql --input payload.json --jq '.data.createCommitOnBranch.commit.oid'

          if gh pr view "$branch" --repo "$TARGET_REPO" --json number --jq '.number' >/dev/null 2>&1; then
            echo "PR for $branch already open; the new commit updates it."
            exit 0
          fi

          gh pr create --repo "$TARGET_REPO" --base main --head "$branch" \
            --title "chore: pin strspc-pr-review skills to $TAG" \
            --body "$(printf '%s\n' \
              "Opened automatically by \`sync-marketplace-pin\` in \`$SOURCE_REPO\` on the $TAG release." \
              "" \
              "Moves the \`$name\` entry to \`ref: $TAG\` / \`sha: $sha\`, sets its \`version\` to \`$version\`, and rebuilds its \`skills\` list from that tag." \
              "" \
              "Until this merges, the $TAG skills reach nobody: Claude Code resolves the plugin from the pinned ref and caches it under the version string, so both have to move." \
              "" \
              "The \`skills\` array is regenerated rather than carried forward — the entry is \`strict: false\`, so that array is the complete set of exposed skills and a newly added one would otherwise never appear.")"
