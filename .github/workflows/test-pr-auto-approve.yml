name: Test PR Auto-Approve Decision Logic

on:
  # No paths filter on pull_request: the auto-approve gate requires at least one
  # COMPLETED check run on the head SHA, and a docs-only PR previously produced
  # none at all (e.g. #22), so it could never be approved. The suite runs in ~5s,
  # so gating every PR is cheaper than setting allow-no-checks and weakening the
  # gate. The push: filter below is left in place — it only affects branch CI.
  pull_request:
  push:
    branches: [develop]
    paths:
      - 'scripts/pr-auto-approve/**'
      - 'scripts/validate-issue-forms.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/pr-auto-approve.yml'
      - '.github/workflows/test-pr-auto-approve.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'rules/**'
      - '.strspc/**'

permissions:
  contents: read

jobs:
  # In this workflow rather than a separate one: auto-approve.yml re-enters
  # through workflow_run on this workflow's name alone, so a check that outlived
  # this workflow would leave the PR at "check still running" with nothing to
  # re-trigger the evaluation.
  #
  # Lifecycle transitions are validated one PR at a time on the way into
  # develop. A release (the same-repository develop -> main PR) aggregates those
  # steps, which rulediff reads as skipped states and body-edit-plus-promotion,
  # so exactly that PR is exempt from the diff.
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@9263d52f18833179ea1ed4fbedbff5516547da2d # main
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/
      diff: >-
        ${{ !(
          github.event_name == 'pull_request'
          && github.base_ref == 'main'
          && github.head_ref == 'develop'
          && github.event.pull_request.head.repo.full_name == github.repository
        ) }}

  check:
    uses: SteerSpec/.github/.github/workflows/strspc-check.yml@9263d52f18833179ea1ed4fbedbff5516547da2d # main
    permissions:
      contents: read
      pull-requests: read

  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run unit tests (with coverage gate)
        run: npm run test:coverage

  lint:
    name: actionlint + shellcheck + issue forms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1
        with:
          fail_level: error
          # Files are named explicitly, so anything omitted is never linted.
          # templates/pr-auto-approve.yml is included because consumers copy it
          # verbatim into their own repos — a syntax error there ships to them.
          actionlint_flags: '.github/workflows/pr-auto-approve.yml .github/workflows/test-pr-auto-approve.yml .github/workflows/release-please.yml .github/workflows/auto-approve.yml .github/workflows/sync-marketplace-pin.yml templates/pr-auto-approve.yml'
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # -x makes shellcheck follow the `source lib.sh` directive in the
          # harnesses. Without it every entrypoint reports SC1091 (cannot
          # follow source) and the shared helpers are never analysed in
          # context. The action has no flag input, but shellcheck itself
          # reads SHELLCHECK_OPTS.
          SHELLCHECK_OPTS: -x
        with:
          scandir: './e2e'
      - name: Validate issue forms
        # GitHub drops a malformed issue form from /issues/new/choose silently —
        # no error, no banner — so a broken template looks identical to a missing
        # one. actionlint does not cover .github/ISSUE_TEMPLATE, hence this step.
        # Runs on the runner's preinstalled python3 + PyYAML, no install step.
        run: python3 scripts/validate-issue-forms.py
