name: Test PR Auto-Approve Decision Logic

on:
  # No paths filter on pull_request: the auto-approve gate requires at least one
  # COMPLETED check run on the head SHA, and a docs-only PR previously produced
  # none at all (e.g. #22), so it could never be approved. The suite runs in ~5s,
  # so gating every PR is cheaper than setting allow-no-checks and weakening the
  # gate. The push: filter below is left in place — it only affects branch CI.
  pull_request:
  push:
    branches: [develop]
    paths:
      - 'scripts/pr-auto-approve/**'
      - '.github/workflows/pr-auto-approve.yml'
      - '.github/workflows/test-pr-auto-approve.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run unit tests (with coverage gate)
        run: npm run test:coverage

  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1
        with:
          fail_level: error
          # Files are named explicitly, so anything omitted is never linted.
          # templates/pr-auto-approve.yml is included because consumers copy it
          # verbatim into their own repos — a syntax error there ships to them.
          actionlint_flags: '.github/workflows/pr-auto-approve.yml .github/workflows/test-pr-auto-approve.yml .github/workflows/release-please.yml .github/workflows/auto-approve.yml templates/pr-auto-approve.yml'
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './e2e'
