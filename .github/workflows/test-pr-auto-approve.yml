name: Test PR Auto-Approve Decision Logic

on:
  pull_request:
    paths:
      - 'scripts/pr-auto-approve/**'
      - '.github/workflows/pr-auto-approve.yml'
      - '.github/workflows/test-pr-auto-approve.yml'
      # CI runs `npm run test:coverage`, so the gate itself lives in package.json.
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [develop]
    paths:
      - 'scripts/pr-auto-approve/**'
      - '.github/workflows/pr-auto-approve.yml'
      - '.github/workflows/test-pr-auto-approve.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run unit tests (with coverage gate)
        run: npm run test:coverage

  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1
        with:
          fail_level: error
          actionlint_flags: '.github/workflows/pr-auto-approve.yml .github/workflows/test-pr-auto-approve.yml .github/workflows/release-please.yml'
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './e2e'
