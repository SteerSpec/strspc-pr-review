name: 'PR Auto-Approve (Copilot)'
description: >-
  Automatically approves pull requests when GitHub Copilot's review is clean
  or after a configurable number of review rounds.
author: 'SteerSpec'
branding:
  icon: check-circle
  color: green

inputs:
  bot-login:
    required: true
    description: >-
      GitHub login of the bot account that will post the APPROVE review.
      The bot-github-token must be a PAT for this account.
  bot-github-token:
    required: true
    description: >-
      PAT for bot-login, used to post the APPROVE review and, when a retitle
      raises the required rounds, to dismiss that bot's own earlier approval
      (if the PAT is refused, the dismissal is retried with github-token).
      It needs only `Pull requests: write` — NOT repo-wide scope. Everything
      else is read with github-token below, because listing check runs requires
      the `Checks` permission, which fine-grained PATs cannot be granted at all;
      a PAT-based read therefore works on public repos (where check runs are
      public) and fails with 403 forever on private ones.
  github-token:
    required: false
    default: ${{ github.token }}
    description: >-
      Token used for every READ (check runs, the PR, its reviews and their
      comments). Defaults to the workflow's GITHUB_TOKEN, which is what makes
      this work on private repositories. The action needs `checks: read`,
      `pull-requests: write` and `contents: read` from it and nothing else; the
      shipped template grants all three. `contents: read` is for the commit
      comparison that lists a PR's changed files when rounds-by-type relaxes
      its type or protected-paths is set (the list is pinned to the evaluated
      head SHA that way), and for the branch, commit and config lookups of promotion-branches and
      release-branches. Override only if you have a reason to read as someone else.
  base-branch:
    required: false
    default: 'main'
    description: >-
      Base branch(es) that PRs must target to be eligible for auto-approval.
      Accepts a single branch or a comma-separated set (e.g. 'develop,main');
      whitespace-only falls back to the default. Default: main. Enforced for
      every event, including pull_request_target and pull_request_review. The
      shipped template reads it from vars.STRSPC_PR_AUTO_APPROVE_BASE_BRANCH and
      uses the same variable in its job if:, so there is one place to change.
  sandbox-repos:
    required: false
    default: ''
    description: >-
      Comma-separated list of repo full names (owner/repo) where bot-authored
      PRs are allowed through the self-approval guard. Used only by e2e test
      harnesses in sandbox/test repositories. Production repos must not appear
      here.
  rounds-threshold:
    required: false
    default: '3'
    description: >-
      Number of Copilot review rounds after which the PR is approved regardless
      of inline comments (default: 3).
  rounds-by-type:
    required: false
    default: ''
    description: >-
      Per-Conventional-Commit-type rounds, read from the PR title, e.g.
      'docs:1,chore:0,fix:3,default:3'. Overrides rounds-threshold for the
      listed types; 'default' covers every other type and non-conventional
      titles; with no 'default' entry they use rounds-threshold. A value of 0
      means Copilot is not required for that type: the PR is approved once CI is
      green (a Copilot CHANGES_REQUESTED review still blocks). A type mapped
      below the default applies only when every changed file matches
      copilot-optional-paths. Empty (default) uses rounds-threshold for every PR.
  copilot-optional-paths:
    required: false
    default: '**/*.md,docs/**/*.md'
    description: >-
      Comma-separated globs. A type mapped below the default in rounds-by-type
      (0 included) applies only when EVERY changed file matches one of these;
      otherwise the PR gets the default threshold (the 'default' entry, else
      rounds-threshold; a 0 is always gated, so 'default:0' falls back to
      rounds-threshold for code) and the reason says so. The title is
      author-controlled, so this stops a code change from borrowing a relaxed type.
  protected-paths:
    required: false
    default: ''
    description: >-
      Comma-separated globs, e.g. 'rules/**,.strspc/**'. A PR changing any file
      that matches one (a rename counts by its old and new name) is handled by
      protected-paths-mode, before every other rule, the rounds threshold and
      rounds-by-type 0 included. Promotion and release PRs are not gated. Empty
      (default) turns the feature off and makes no extra API call.
  protected-paths-mode:
    required: false
    default: 'manual'
    description: >-
      What happens to a PR matching protected-paths. 'manual': it waits for a
      human. 'allowlist': it gets the normal rules only if its author and every
      commit's author and committer are on protected-paths-allowed, and waits
      otherwise. 'approve': the normal rules, with no file listing. A PR that
      waits has any bot approval withdrawn; a PR whose files cannot be
      completely listed waits in manual and allowlist. An empty or unknown
      value means 'manual'.
  protected-paths-allowed:
    required: false
    default: ''
    description: >-
      Comma-separated GitHub logins, without '@', compared case-insensitively.
      Used only by protected-paths-mode 'allowlist'. Empty allows nobody.
  copilot-clean-on:
    required: false
    default: 'verdict'
    description: >-
      Which verdicts in Copilot's review overview can pass as clean. 'verdict'
      (default): only 'Approval recommended'. 'no-open-issues': also 'Needs a
      closer look', when the body states 'No open issues'. That statement covers
      published threads only, so the verdict sentence can still name a finding.
      'Changes recommended' and unknown verdicts never pass, and an unrecognised
      value reads as 'verdict'.
  promotion-branches:
    required: false
    default: ''
    description: >-
      Comma-separated head:base pairs that are approved without a Copilot review,
      e.g. 'develop:main'. A PR matching a pair exactly must have a chore: title,
      a head that is the branch tip, green checks, and every commit from a merged
      PR into the head branch with a standing approval. Each base must also be in
      base-branch. Empty (default) turns this off.
  release-branches:
    required: false
    default: ''
    description: >-
      Comma-separated source:base pairs, e.g. 'develop:main', whose release-please
      PRs into base are approved without a Copilot review. A bare base such as
      'main' does the same with no source branch to check, for a repo without
      develop. Needs release-author. The PR must come from release-author, have a
      head that is the branch tip, change only files release-please owns (read from
      release-please-config.json at the base), have green checks, and the source
      branch must hold no commit the changelog would show. Each base must also be
      in base-branch. Empty (default) turns this off.
  release-author:
    required: false
    default: ''
    description: >-
      Login that must have authored a release PR and all its commits, e.g.
      'my-release-app[bot]'. Anyone with write access can push a branch with the
      release-please name, so release-branches refuses every release PR without it.
  request-copilot-review:
    required: false
    default: 'false'
    description: >-
      When true, the action requests the Copilot review itself, skipping PRs
      whose type is 0 in rounds-by-type. Turn off the ruleset's "Automatically
      request Copilot code review" first, or Copilot reviews every PR anyway.
      Needs pull_request_target (with the 'edited' type) in the caller.
      Failures only log a warning.
  copilot-error-retries:
    required: false
    default: '0'
    description: >-
      Times to re-request Copilot's review on the same head commit when it
      reviewed nothing because its run errored or the requester was out of
      quota. Such reviews never approve or count as rounds either way. 0 (default) disables the
      automatic re-request. Uses github-token; failures only log a warning.
  allow-no-checks:
    required: false
    default: 'false'
    description: >-
      When true, skip the "all checks must pass" gate when no external check
      runs exist for the head SHA (e.g., docs-only PRs that trigger no CI).
      Defaults to false (safe default: require at least one passing check).
  wait-for-copilot-seconds:
    required: false
    default: '0'
    description: >-
      Seconds to wait for Copilot's review instead of skipping immediately:
      while its check run is pending, for it and every other check still
      running (CI included, even when Copilot finishes first), and, once
      every check has completed, for the review itself (Copilot no longer
      registers a check run on the head). 0 (default) keeps the previous
      behaviour. Needed because Copilot cannot re-trigger the
      workflow itself: its check run is created with GITHUB_TOKEN, and
      GITHUB_TOKEN-generated events never start a new workflow run (the
      recursion guard — the check_run event is emitted, it just cannot start
      the job), and GitHub holds runs Copilot triggers at "action_required"
      pending manual approval. Without this, a PR whose Copilot review lands
      AFTER CI is never re-evaluated. Opt-in because waiting consumes billable
      Actions minutes on private repos (it is free on public ones); 600 is a
      sensible starting point: Copilot finished more than 300s after CI on 11%
      of the reviews sampled, and more than 600s after on 3%. The wait ends as
      soon as Copilot and the checks it waits on finish, so a longer budget
      costs minutes only when the review or a check is slow or never comes.
      A failed check ends the wait at once. The run that waits need not be
      the one started by CI completing, because that workflow_run event can
      fail to arrive (#198). So on private repos a run may bill minutes from
      the first completed workflow until CI finishes, unless a later run
      cancels it through the concurrency group first.
  test-copilot-logins:
    required: false
    default: ''
    description: >-
      Test-only: comma-separated GitHub logins to treat as "Copilot" reviewers
      in addition to the real Copilot bot. Used by the e2e harness in sandbox
      repos listed in sandbox-repos; production callers MUST NOT set this.
  slack-channel:
    required: false
    default: 'alert-pr-notifications'
    description: >-
      Slack channel name or ID for notifications (default:
      alert-pr-notifications; an empty value also means the default). Used only
      when slack-bot-token is set.
  slack-bot-token:
    required: false
    default: ''
    description: >-
      Slack bot OAuth token (xoxb-...) with chat:write scope. When set, posts
      approve/skip/error notifications via chat.postMessage.

outputs:
  decision:
    description: 'Outcome of the evaluation: approved, skip, or error.'
    value: ${{ steps.evaluate.outputs.decision }}
  reason:
    description: 'Human-readable explanation of the decision.'
    value: ${{ steps.evaluate.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Request bot review
      if: >-
        github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'reopened')
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      env:
        # Through env, never interpolated into the script: bot-login can come from
        # an Actions variable, and a quote in it would otherwise inject code.
        BOT_LOGIN: ${{ inputs.bot-login }}
        ACTION_PATH: ${{ github.action_path }}
        AUTO_APPROVE_GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        # The workflow token, not the PAT. Requesting a review FROM the bot does
        # not have to be done BY the bot -- any token with pull-requests: write
        # can request a collaborator. Keeping the PAT to the approval alone is
        # what lets its permissions stay at Pull requests: write, and makes the
        # token contract in the inputs above literally true.
        github-token: ${{ inputs.github-token }}
        script: |
          // Best-effort, exactly like decide.js's top-level try/catch: this step
          // must never flip a check red for a reason unrelated to the review
          // state. Requesting the review is a convenience — repos that request
          // Copilot via a ruleset don't need it at all, and the approval itself
          // is decided by the evaluate step below regardless. A token without
          // pull-requests: write 403s here, which previously failed the whole job
          // BEFORE the evaluation ever ran.
          const botLogin = process.env.BOT_LOGIN;
          try {
            // A client that retries a transient 5xx; see makeApiClient in decide.js.
            const { makeApiClient } = require(`${process.env.ACTION_PATH}/scripts/pr-auto-approve/decide.js`);
            const api = makeApiClient(getOctokit, process.env.AUTO_APPROVE_GITHUB_TOKEN);
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await api.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.user.login === botLogin) return; // can't request review from the PR's own author
            const alreadyRequested = pr.requested_reviewers.some(r => r.login === botLogin);
            if (!alreadyRequested) {
              await api.rest.pulls.requestReviewers({
                owner, repo, pull_number: prNumber,
                reviewers: [botLogin],
              });
            }
          } catch (err) {
            core.warning(
              `pr-auto-approve: could not request a review from ${botLogin}: ${err.status || ''} ${err.message || err}`.trim(),
            );
          }

    - name: Request Copilot review
      if: >-
        inputs.request-copilot-review == 'true' &&
        github.event_name == 'pull_request_target' &&
        contains(fromJSON('["opened","ready_for_review","reopened","synchronize","edited"]'), github.event.action)
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      env:
        AUTO_APPROVE_ROUNDS_BY_TYPE: ${{ inputs.rounds-by-type }}
        AUTO_APPROVE_ROUNDS_THRESHOLD: ${{ inputs.rounds-threshold }}
        AUTO_APPROVE_COPILOT_OPTIONAL_PATHS: ${{ inputs.copilot-optional-paths }}
        AUTO_APPROVE_PROMOTION_BRANCHES: ${{ inputs.promotion-branches }}
        AUTO_APPROVE_RELEASE_BRANCHES: ${{ inputs.release-branches }}
        ACTION_PATH: ${{ github.action_path }}
        AUTO_APPROVE_GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // The logic (and its tests) live in decide.js. It is best-effort and
          // never fails the step: requesting a review must not turn the check red.
          const { requestCopilotReview, makeApiClient } = require(`${process.env.ACTION_PATH}/scripts/pr-auto-approve/decide.js`);
          const api = makeApiClient(getOctokit, process.env.AUTO_APPROVE_GITHUB_TOKEN);
          await requestCopilotReview({ github: api, context, core });

    - name: Evaluate and approve
      id: evaluate
      uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
      env:
        AUTO_APPROVE_BOT_LOGIN: ${{ inputs.bot-login }}
        AUTO_APPROVE_BASE_BRANCH: ${{ inputs.base-branch }}
        AUTO_APPROVE_ROUNDS_THRESHOLD: ${{ inputs.rounds-threshold }}
        AUTO_APPROVE_ROUNDS_BY_TYPE: ${{ inputs.rounds-by-type }}
        AUTO_APPROVE_COPILOT_OPTIONAL_PATHS: ${{ inputs.copilot-optional-paths }}
        AUTO_APPROVE_PROTECTED_PATHS: ${{ inputs.protected-paths }}
        AUTO_APPROVE_PROTECTED_PATHS_MODE: ${{ inputs.protected-paths-mode }}
        AUTO_APPROVE_PROTECTED_PATHS_ALLOWED: ${{ inputs.protected-paths-allowed }}
        AUTO_APPROVE_COPILOT_CLEAN_ON: ${{ inputs.copilot-clean-on }}
        AUTO_APPROVE_PROMOTION_BRANCHES: ${{ inputs.promotion-branches }}
        AUTO_APPROVE_RELEASE_BRANCHES: ${{ inputs.release-branches }}
        AUTO_APPROVE_RELEASE_AUTHOR: ${{ inputs.release-author }}
        AUTO_APPROVE_ALLOW_NO_CHECKS: ${{ inputs.allow-no-checks }}
        AUTO_APPROVE_COPILOT_WAIT_SECONDS: ${{ inputs.wait-for-copilot-seconds }}
        AUTO_APPROVE_COPILOT_ERROR_RETRIES: ${{ inputs.copilot-error-retries }}
        AUTO_APPROVE_SANDBOX_REPOS: ${{ inputs.sandbox-repos }}
        AUTO_APPROVE_COPILOT_TEST_LOGINS: ${{ inputs.test-copilot-logins }}
        ACTION_PATH: ${{ github.action_path }}
        AUTO_APPROVE_BOT_TOKEN: ${{ inputs.bot-github-token }}
        AUTO_APPROVE_GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        # The READ token. Every read goes through a client built below from the
        # same token (AUTO_APPROVE_GITHUB_TOKEN); the approval needs the bot
        # instead, so a second client is built from the PAT. Both come from
        # makeApiClient, which retries a transient 5xx. Do not set this step's
        # `retries` input: see makeApiClient in decide.js for why.
        github-token: ${{ inputs.github-token }}
        script: |
          // getOctokit is injected by github-script v9. Do NOT write
          // `const getOctokit = ...` -- v9 passes it as a function parameter and
          // redeclaring one is a SyntaxError. On v7 this was impossible
          // altogether (require('@actions/github') fails with "Cannot find
          // module"), which is why v1.6.0 shipped a hand-rolled fetch client;
          // that client is gone, and with it three bugs Octokit does not have.
          const decide = require(`${process.env.ACTION_PATH}/scripts/pr-auto-approve/decide.js`);
          const api = decide.makeApiClient(getOctokit, process.env.AUTO_APPROVE_GITHUB_TOKEN);
          const botGithub = decide.makeApiClient(getOctokit, process.env.AUTO_APPROVE_BOT_TOKEN);
          await decide({ github: api, botGithub, context, core });

    - name: Notify Slack (approved)
      if: steps.evaluate.outputs.decision == 'approved' && inputs.slack-bot-token != ''
      continue-on-error: true
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        # || because a caller passing an unset variable sends '', not the default.
        SLACK_CHANNEL: ${{ inputs.slack-channel || 'alert-pr-notifications' }}
        REPO: ${{ github.repository }}
        SANDBOX_REPOS: ${{ inputs.sandbox-repos }}
        PR_URL: ${{ github.event.pull_request.html_url || steps.evaluate.outputs.pr_url }}
        PR_NUMBER: ${{ github.event.pull_request.number || steps.evaluate.outputs.pr_number }}
        PR_TITLE: ${{ github.event.pull_request.title || steps.evaluate.outputs.pr_title }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.evaluate.outputs.pr_author }}
        REASON: ${{ steps.evaluate.outputs.reason }}
      run: |
        payload=$(jq -nc \
          --arg channel "$SLACK_CHANNEL" \
          --arg repo "$REPO" \
          --arg sandbox "$SANDBOX_REPOS" \
          --arg url "$PR_URL" \
          --arg num "$PR_NUMBER" \
          --arg title "$PR_TITLE" \
          --arg author "$PR_AUTHOR" \
          --arg reason "$REASON" \
          'def s: gsub("&";"&amp;")|gsub("<";"&lt;")|gsub(">";"&gt;")|gsub("\\|";"｜");
           def test_flag: if ($sandbox | split(",") | map(gsub("^\\s+|\\s+$";"")) | index($repo)) then "[TEST] " else "" end;
           def author_part: if $author == "" then "" else "  @" + $author end;
           def title_part: if ($title|s) == "" then "" else " — " + ($title|s) end;
           {channel: $channel,
            attachments: [{
              color: "#36a64f",
              text: (test_flag + "<" + $url + "|" + ($repo | split("/")[-1]) + "#" + $num + ">" + author_part + title_part + "\n" + ($reason|s))
            }]}')
        curl -sS -X POST \
          -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
          -H 'Content-type: application/json; charset=utf-8' \
          --data "$payload" \
          https://slack.com/api/chat.postMessage

    # Not for a sweep: it runs on a schedule, and a PR parked for a human would
    # post the same skip every time.
    - name: Notify Slack (skipped)
      if: >-
        steps.evaluate.outputs.decision == 'skip' && inputs.slack-bot-token != '' &&
        github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      continue-on-error: true
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        # || because a caller passing an unset variable sends '', not the default.
        SLACK_CHANNEL: ${{ inputs.slack-channel || 'alert-pr-notifications' }}
        REPO: ${{ github.repository }}
        SANDBOX_REPOS: ${{ inputs.sandbox-repos }}
        PR_URL: ${{ github.event.pull_request.html_url || steps.evaluate.outputs.pr_url }}
        PR_NUMBER: ${{ github.event.pull_request.number || steps.evaluate.outputs.pr_number }}
        PR_TITLE: ${{ github.event.pull_request.title || steps.evaluate.outputs.pr_title }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.evaluate.outputs.pr_author }}
        REASON: ${{ steps.evaluate.outputs.reason }}
      run: |
        payload=$(jq -nc \
          --arg channel "$SLACK_CHANNEL" \
          --arg repo "$REPO" \
          --arg sandbox "$SANDBOX_REPOS" \
          --arg url "$PR_URL" \
          --arg num "$PR_NUMBER" \
          --arg title "$PR_TITLE" \
          --arg author "$PR_AUTHOR" \
          --arg reason "$REASON" \
          'def s: gsub("&";"&amp;")|gsub("<";"&lt;")|gsub(">";"&gt;")|gsub("\\|";"｜");
           def test_flag: if ($sandbox | split(",") | map(gsub("^\\s+|\\s+$";"")) | index($repo)) then "[TEST] " else "" end;
           def author_part: if $author == "" then "" else "  @" + $author end;
           def title_part: if ($title|s) == "" then "" else " — " + ($title|s) end;
           {channel: $channel,
            attachments: [{
              color: "#e8912d",
              text: (test_flag + "<" + $url + "|" + ($repo | split("/")[-1]) + "#" + $num + ">" + author_part + title_part + "\nskipped: " + ($reason|s))
            }]}')
        curl -sS -X POST \
          -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
          -H 'Content-type: application/json; charset=utf-8' \
          --data "$payload" \
          https://slack.com/api/chat.postMessage

    - name: Notify Slack (error)
      if: failure() && inputs.slack-bot-token != ''
      continue-on-error: true
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        # || because a caller passing an unset variable sends '', not the default.
        SLACK_CHANNEL: ${{ inputs.slack-channel || 'alert-pr-notifications' }}
        REPO: ${{ github.repository }}
        SANDBOX_REPOS: ${{ inputs.sandbox-repos }}
        PR_URL: ${{ github.event.pull_request.html_url || steps.evaluate.outputs.pr_url }}
        PR_NUMBER: ${{ github.event.pull_request.number || steps.evaluate.outputs.pr_number }}
        PR_TITLE: ${{ github.event.pull_request.title || steps.evaluate.outputs.pr_title }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.evaluate.outputs.pr_author }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        payload=$(jq -nc \
          --arg channel "$SLACK_CHANNEL" \
          --arg repo "$REPO" \
          --arg sandbox "$SANDBOX_REPOS" \
          --arg url "$PR_URL" \
          --arg num "$PR_NUMBER" \
          --arg title "$PR_TITLE" \
          --arg author "$PR_AUTHOR" \
          --arg runUrl "$RUN_URL" \
          'def s: gsub("&";"&amp;")|gsub("<";"&lt;")|gsub(">";"&gt;")|gsub("\\|";"｜");
           def test_flag: if ($sandbox | split(",") | map(gsub("^\\s+|\\s+$";"")) | index($repo)) then "[TEST] " else "" end;
           def author_part: if $author == "" then "" else "  @" + $author end;
           def title_part: if ($title|s) == "" then "" else " — " + ($title|s) end;
           {channel: $channel,
            attachments: [{
              color: "#ff0000",
              text: (test_flag + "<" + $url + "|" + ($repo | split("/")[-1]) + "#" + $num + ">" + author_part + title_part + "\nerror — <" + $runUrl + "|run log>")
            }]}')
        curl -sS -X POST \
          -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
          -H 'Content-type: application/json; charset=utf-8' \
          --data "$payload" \
          https://slack.com/api/chat.postMessage
